<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Love Story for You 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Prata&family=Cormorant+Garamond:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
            background: linear-gradient(135deg, #ffe5ec 0%, #fff5f7 50%, #ffe5ec 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8b3a3a;
        }

        /* Background soft glow */
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 30% 40%, rgba(255, 182, 193, 0.15), transparent 50%),
                        radial-gradient(circle at 70% 60%, rgba(255, 192, 203, 0.1), transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        /* Main container */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* Screen wrapper */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 1.2s ease-in-out;
            pointer-events: none;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
            animation: screen-fade-in 1.2s ease-in-out;
        }

        @keyframes screen-fade-in {
            0% {
                opacity: 0;
            }
            100% {
                opacity: 1;
            }
        }

        /* Screen 1 - Opening */
        .screen-1 {
            max-width: 600px;
        }

        .opening-text {
            font-family: 'Prata', serif;
            font-size: clamp(28px, 8vw, 64px);
            font-weight: 400;
            color: #c84b5a;
            line-height: 1.4;
            letter-spacing: 1px;
            animation: text-appear 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes text-appear {
            0% {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(8px);
            }
            60% {
                opacity: 0.95;
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* Subtle floating hearts - screen 1 */
        .floating-hearts-small {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            opacity: 0;
            animation: fade-in 2.5s ease-out 0.5s forwards;
        }

        .heart-small {
            font-size: 32px;
            animation: gentle-float 3s ease-in-out infinite;
            opacity: 0.7;
        }

        .heart-small:nth-child(2) {
            animation-delay: 0.5s;
        }

        @keyframes gentle-float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-15px);
            }
        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Screen 2 - Emotional message */
        .screen-2 {
            max-width: 700px;
        }

        .emotional-message {
            font-size: clamp(24px, 6vw, 48px);
            font-weight: 300;
            color: #b8505f;
            line-height: 1.6;
            letter-spacing: 1px;
            max-width: 600px;
            animation: soft-reveal 2.5s ease-out forwards;
            opacity: 0;
        }

        @keyframes soft-reveal {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .heart-pulsing {
            font-size: 60px;
            margin: 30px 0;
            animation: heartbeat 1.3s ease-in-out infinite, fade-in 1.5s ease-out 0.3s forwards;
            opacity: 0;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(200, 75, 90, 0.2));
            }
            22% {
                transform: scale(1.12);
                filter: drop-shadow(0 0 12px rgba(200, 75, 90, 0.4));
            }
            44% {
                transform: scale(1.22);
                filter: drop-shadow(0 0 22px rgba(200, 75, 90, 0.6));
            }
            66% {
                transform: scale(1.12);
                filter: drop-shadow(0 0 12px rgba(200, 75, 90, 0.4));
            }
        }

        /* Screen 3 - Valentine question */
        .screen-3 {
            max-width: 800px;
        }

        .hearts-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: clamp(50px, 12vw, 100px);
            margin-bottom: 40px;
            opacity: 0;
            animation: fade-in 2s ease-out forwards;
        }

        .heart-display {
            animation: gentle-beat 1.3s ease-in-out infinite;
        }

        .heart-display:nth-child(2) {
            animation-delay: 0.3s;
        }

        .heart-display:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes gentle-beat {
            0%, 100% {
                transform: scale(1);
                filter: drop-shadow(0 0 5px rgba(200, 75, 90, 0.2));
            }
            50% {
                transform: scale(1.2);
                filter: drop-shadow(0 0 20px rgba(200, 75, 90, 0.5));
            }
        }

        .valentine-title {
            font-family: 'Prata', serif;
            font-size: clamp(32px, 7vw, 56px);
            color: #c84b5a;
            margin-bottom: 20px;
            opacity: 0;
            animation: soft-reveal 2s ease-out 0.3s forwards;
            letter-spacing: 2px;
        }

        .valentine-message {
            font-size: clamp(18px, 5vw, 28px);
            color: #b8505f;
            line-height: 1.8;
            margin: 20px 0;
            opacity: 0;
            animation: soft-reveal 2s ease-out 0.6s forwards;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Sparkle elements */
        .sparkle {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            animation: sparkle-twinkle 2.5s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sparkle-twinkle {
            0%, 100% {
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
        }

        .sparkle-1 {
            top: 15%;
            right: 10%;
            animation-delay: 0s;
        }

        .sparkle-2 {
            top: 20%;
            left: 8%;
            animation-delay: 0.5s;
        }

        .sparkle-3 {
            bottom: 20%;
            right: 5%;
            animation-delay: 1s;
        }

        .sparkle-4 {
            bottom: 15%;
            left: 10%;
            animation-delay: 1.5s;
        }

        /* Navigation button */
        .nav-btn {
            position: absolute;
            bottom: 50px;
            padding: 14px 40px;
            border: 2px solid #c84b5a;
            border-radius: 50px;
            background: rgba(200, 75, 90, 0.08);
            color: #c84b5a;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.5s ease;
            font-family: 'Cormorant Garamond', serif;
            opacity: 0;
            animation: fade-in 2s ease-out 1.5s forwards;
            backdrop-filter: blur(5px);
        }

        .nav-btn:hover {
            background: rgba(200, 75, 90, 0.15);
            box-shadow: 0 0 40px rgba(200, 75, 90, 0.35);
            transform: translateY(-3px);
            border-color: #c84b5a;
        }

        .nav-btn:active {
            transform: translateY(0);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Final screen button */
        .final-btn {
            margin-top: 30px;
            padding: 16px 50px;
            font-size: 16px;
            border: 2px solid #c84b5a;
            background: rgba(200, 75, 90, 0.12);
            color: #c84b5a;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.5s ease;
            font-family: 'Cormorant Garamond', serif;
            opacity: 0;
            animation: fade-in 2.5s ease-out 1.2s forwards;
        }

        .final-btn:hover {
            background: rgba(200, 75, 90, 0.2);
            box-shadow: 0 0 40px rgba(200, 75, 90, 0.4);
            transform: translateY(-3px);
        }

        .final-btn:active {
            transform: translateY(-1px);
        }

        /* Responsive adjustments */
        @media(max-width: 600px) {
            .screen {
                padding: 30px 20px;
            }

            .floating-hearts-small {
                gap: 20px;
                margin-top: 30px;
            }

            .heart-small {
                font-size: 24px;
            }

            .hearts-display {
                gap: 15px;
                margin-bottom: 30px;
            }

            .nav-btn {
                bottom: 40px;
                padding: 12px 35px;
                font-size: 13px;
            }

            .final-btn {
                padding: 14px 40px;
                font-size: 14px;
            }
        }

        @media(max-width: 480px) {
            .opening-text {
                word-spacing: 0.1em;
            }

            .heart-small {
                font-size: 20px;
            }

            .floating-hearts-small {
                gap: 15px;
                margin-top: 25px;
            }

            .nav-btn {
                bottom: 35px;
                padding: 11px 30px;
                font-size: 12px;
            }

            .final-btn {
                padding: 12px 35px;
                font-size: 13px;
                margin-top: 25px;
            }

            .sparkle {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- Background glow -->
    <div class="bg-glow"></div>

    <!-- Background romantic music - Local romantic instrumental audio -->
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <!-- Main container -->
    <div class="container">
        <!-- Screen 1: Opening -->
        <div class="screen screen-1 active">
            <div class="opening-text">
                Hey… I have something<br>to tell you 🥺
            </div>
            <div class="floating-hearts-small">
                <span class="heart-small">💕</span>
                <span class="heart-small">💕</span>
                <span class="heart-small">💕</span>
            </div>
            <button class="nav-btn" onclick="nextScreen()">Continue →</button>
        </div>

        <!-- Screen 2: Emotional message -->
        <div class="screen screen-2">
            <div class="heart-pulsing">❤️</div>
            <div class="emotional-message">
                Every moment with you<br>feels special
            </div>
            <p style="font-size: clamp(14px, 4vw, 20px); color: #b8505f; margin-top: 30px; opacity: 0; animation: soft-reveal 2s ease-out 0.9s forwards; font-weight: 300;">
                You make my heart beat a little faster
            </p>
            <button class="nav-btn" onclick="nextScreen()">I feel it too →</button>
        </div>

        <!-- Screen 3: Valentine question -->
        <div class="screen screen-3">
            <div class="hearts-display">
                <span class="heart-display">💕</span>
                <span class="heart-display">❤️</span>
                <span class="heart-display">💕</span>
            </div>
            <div class="valentine-title">Be My Valentine?</div>
            <div class="valentine-message">
                I want to cherish every moment with you,<br>
                To be the reason you smile,<br>
                And to love you more with each passing day.
            </div>
            <button class="final-btn" onclick="celebrate()">Yes! 💕</button>
            <button class="final-btn" onclick="celebrate()" style="margin-left: 10px;">Absolutely! 💕</button>

            <!-- Sparkles -->
            <span class="sparkle sparkle-1">✨</span>
            <span class="sparkle sparkle-2">✨</span>
            <span class="sparkle sparkle-3">✨</span>
            <span class="sparkle sparkle-4">✨</span>
        </div>
    </div>

    <script>
        let currentScreen = 0;
        const screens = document.querySelectorAll('.screen');
        const totalScreens = screens.length;

        function nextScreen() {
            if (currentScreen < totalScreens - 1) {
                screens[currentScreen].classList.remove('active');
                currentScreen++;
                screens[currentScreen].classList.add('active');
            }
        }

        function celebrate() {
            // Play romantic music at celebratory volume
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.35; // Gentle increase to 35% for celebration
            bgMusic.currentTime = 0;
            bgMusic.play().catch(e => {
                console.log('Music playback initiated');
            });

            // Create romantic celebration
            const colors = ['❤️', '💕', '💖', '💗', '💓', '💞'];
            
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.textContent = colors[Math.floor(Math.random() * colors.length)];
                    heart.style.position = 'fixed';
                    heart.style.left = Math.random() * 100 + '%';
                    heart.style.top = '100%';
                    heart.style.fontSize = (20 + Math.random() * 30) + 'px';
                    heart.style.zIndex = '100';
                    heart.style.pointerEvents = 'none';
                    heart.style.animation = `float-up ${2 + Math.random() * 2}s ease-out forwards`;
                    
                    // Add animation
                    const style = document.createElement('style');
                    style.textContent = `
                        @keyframes float-up {
                            0% {
                                transform: translateY(0) rotate(0deg);
                                opacity: 1;
                            }
                            100% {
                                transform: translateY(-${100 + Math.random() * 200}vh) rotate(${Math.random() * 360}deg);
                                opacity: 0;
                            }
                        }
                    `;
                    if (!document.querySelector('style[data-animation]')) {
                        document.head.appendChild(style);
                        style.setAttribute('data-animation', 'true');
                    }
                    
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 4000);
                }, i * 50);
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') {
                nextScreen();
            }
        });

        // Start soft background music on page load
        window.addEventListener('load', () => {
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.12; // Very low volume (12%) - emotional layer
            bgMusic.play().catch(e => {
                console.log('Auto-play prevented - user interaction may be required');
            });
        });

        // Allow user to interact with music on first click/touch
        document.addEventListener('click', () => {
            const bgMusic = document.getElementById('bgMusic');
            if (bgMusic.paused) {
                bgMusic.volume = 0.12; // Reset to soft volume
                bgMusic.play().catch(e => {
                    console.log('Music playback failed');
                });
            }
        }, { once: true });
    </script>
</body>
</html>
