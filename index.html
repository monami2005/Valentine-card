<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love U - My Simjang ❤️</title>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Cormorant+Garamond:wght@300;400;600&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    width:100%;
    height:100vh;
    overflow:hidden;
    font-family:'Quicksand',sans-serif;
    background:linear-gradient(135deg,#ff1a1a 0%,#ff6b9d 25%,#f8a5c8 50%,#ffc6e5 75%,#fff0f5 100%);
    background-attachment:fixed;
    display:flex;
    align-items:center;
    justify-content:center;
}

/* Animated background elements */
.bg-blur{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:radial-gradient(circle at 20% 50%,rgba(255,26,26,0.1),transparent 50%),
                radial-gradient(circle at 80% 80%,rgba(255,107,157,0.1),transparent 50%);
    pointer-events:none;
    z-index:1;
}

/* Floating hearts - background */
.heart-float{
    position:fixed;
    font-size:30px;
    opacity:0.3;
    animation:floating 6s ease-in-out infinite;
    pointer-events:none;
    z-index:2;
}
@keyframes floating{
    0%,100%{transform:translateY(0) rotate(0deg)}
    25%{transform:translateY(-20px) rotate(5deg)}
    50%{transform:translateY(-40px) rotate(-5deg)}
    75%{transform:translateY(-20px) rotate(5deg)}
}

/* Sparkle particles */
.sparkle{
    position:fixed;
    pointer-events:none;
    animation:sparkle-float 3s ease-out forwards;
    z-index:3;
}
@keyframes sparkle-float{
    0%{opacity:1;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(0)}
}

/* Main container */
.container{
    position:relative;
    z-index:10;
    text-align:center;
    width:90%;
    max-width:600px;
    padding:20px;
}

/* Cinematic glowing heart - behind text */
.cinematic-heart{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:200px;
    opacity:0;
    animation:cinematic-glow 4s ease-in-out forwards;
    z-index:-1;
    text-shadow:0 0 60px #ff1a1a,0 0 100px #ff6b9d,0 0 150px #ff1a1a;
    filter:blur(3px);
}
@keyframes cinematic-glow{
    0%{opacity:0;transform:translate(-50%,-50%) scale(0.5)}
    30%{opacity:0.3;transform:translate(-50%,-50%) scale(0.8)}
    60%{opacity:0.5;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0.4;transform:translate(-50%,-50%) scale(1.2)}
}

/* Main love text */
.love-text{
    font-family:'Prata',serif;
    font-size:clamp(48px,12vw,120px);
    font-weight:600;
    color:#FF1A1A;
    letter-spacing:3px;
    margin:20px 0;
    text-shadow:
        0 0 20px rgba(255,26,26,0.5),
        0 0 40px rgba(255,107,157,0.3),
        0 0 60px rgba(255,26,26,0.2);
    animation:love-text-animate 3s ease-out forwards;
    word-spacing:10px;
    line-height:1.2;
}
@keyframes love-text-animate{
    0%{
        opacity:0;
        transform:translateY(50px) scale(0.8);
        filter:blur(10px);
    }
    50%{
        opacity:0.8;
    }
    100%{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

/* Name styling */
.name-display{
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(32px,8vw,56px);
    color:#FF1A1A;
    font-weight:300;
    letter-spacing:2px;
    margin-top:30px;
    opacity:0;
    animation:name-float 2.5s ease-out 0.8s forwards;
    text-shadow:0 0 15px rgba(255,26,26,0.4);
}
@keyframes name-float{
    0%{opacity:0;transform:translateY(30px) scale(0.8)}
    100%{opacity:1;transform:translateY(0) scale(1)}
}

/* Subtitle */
.subtitle{
    font-size:14px;
    color:#FF1A1A;
    letter-spacing:1px;
    margin-top:20px;
    opacity:0;
    animation:subtitle-fade 2s ease 1.2s forwards;
    text-transform:uppercase;
}
@keyframes subtitle-fade{
    from{opacity:0}
    to{opacity:0.8}
}

/* Interactive button */
.action-btn{
    margin-top:40px;
    padding:16px 45px;
    border:2px solid #FF1A1A;
    border-radius:50px;
    background:rgba(255,26,26,0.1);
    color:#FF1A1A;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    letter-spacing:1px;
    transition:all 0.4s ease;
    position:relative;
    overflow:hidden;
    backdrop-filter:blur(5px);
    opacity:0;
    animation:button-appear 2s ease 1.5s forwards;
}
.action-btn::before{
    content:'';
    position:absolute;
    top:0;
    left:-100%;
    width:100%;
    height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,26,26,0.3),transparent);
    transition:0.6s;
}
.action-btn:hover{
    background:rgba(255,26,26,0.2);
    box-shadow:0 0 30px rgba(255,26,26,0.5);
    transform:scale(1.08);
    border-color:#FF1A1A;
}
.action-btn:hover::before{
    left:100%;
}
@keyframes button-appear{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

/* Message container - hidden initially */
.message-container{
    display:none;
    margin-top:30px;
    opacity:0;
    animation:message-appear 1.5s ease forwards;
}
@keyframes message-appear{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

.heart-display{
    font-size:clamp(60px,15vw,150px);
    margin:20px 0;
    animation:heart-beat 0.8s ease-out infinite;
    text-shadow:0 0 30px #ff1a1a,0 0 60px #ff6b9d;
    filter:drop-shadow(0 0 20px rgba(255,26,26,0.6));
}
@keyframes heart-beat{
    0%,100%{transform:scale(1)}
    25%{transform:scale(1.1)}
    50%{transform:scale(1.15)}
    75%{transform:scale(1.1)}
}

/* Responsive - Tablets */
@media(max-width:768px){
    .love-text{font-size:48px}
    .name-display{font-size:32px}
    .action-btn{padding:14px 40px;font-size:14px}
    .cinematic-heart{font-size:150px}
}

/* Responsive - Large tablets */
@media(max-width:600px){
    .container{width:95%;padding:15px}
    .love-text{font-size:clamp(36px,10vw,48px)}
    .name-display{font-size:clamp(24px,7vw,32px)}
    .subtitle{font-size:12px}
    .action-btn{padding:13px 35px;font-size:13px;margin-top:30px}
    .cinematic-heart{font-size:120px}
    .heart-display{font-size:clamp(50px,12vw,100px)}
}

/* Responsive - Small phones */
@media(max-width:480px){
    body{height:100%;min-height:100vh}
    .container{width:100%;padding:15px;max-width:100%}
    .love-text{
        font-size:clamp(32px,9vw,42px);
        margin:15px 0;
        letter-spacing:2px
    }
    .name-display{
        font-size:clamp(20px,6vw,28px);
        margin-top:20px
    }
    .subtitle{font-size:11px;margin-top:15px}
    .action-btn{
        padding:12px 30px;
        font-size:12px;
        margin-top:25px;
        border-radius:40px
    }
    .cinematic-heart{font-size:100px}
    .heart-display{font-size:clamp(45px,10vw,80px)}
    .message-container{margin-top:20px}
    .heart-float{font-size:20px}
}

/* Extra small phones - under 360px */
@media(max-width:360px){
    .container{padding:10px}
    .love-text{
        font-size:clamp(28px,8vw,36px);
        margin:10px 0;
        letter-spacing:1px;
        word-spacing:5px
    }
    .name-display{
        font-size:clamp(18px,5vw,24px);
        margin-top:15px
    }
    .subtitle{font-size:10px;margin-top:12px}
    .action-btn{
        padding:11px 25px;
        font-size:11px;
        margin-top:20px
    }
    .cinematic-heart{font-size:80px}
    .heart-float{font-size:16px}
}
</style>
</head>

<body>

<!-- Background blur effect -->
<div class="bg-blur"></div>

<!-- Audio element - Local romantic Valentine instrumental music -->
<audio id="bgMusic" src="music.mp3" loop></audio>

<!-- Main container -->
<div class="container">
    <!-- Cinematic heart -->
    <div class="cinematic-heart" id="cinematicHeart">❤️</div>

    <!-- Main love text -->
    <div class="love-text">I Love U</div>

    <!-- Name -->
    <div class="name-display">My Simjang</div>

    <!-- Subtitle -->
    <div class="subtitle">Forever & Always</div>

    <!-- Button -->
    <button class="action-btn" onclick="activateRomance()">Express My Love</button>

    <!-- Message that appears after button click -->
    <div class="message-container" id="messageContainer">
        <div class="heart-display">❤️</div>
        <p style="font-size:18px;color:#FF1A1A;font-weight:300;letter-spacing:1px;margin:20px 0;">
            You are my everything<br>
            <span style="font-size:14px;">Every moment with you is a treasure</span>
        </p>
    </div>
</div>

<!-- Floating hearts generator -->
<script>
function generateFloatingHearts(){
    const heartVariants = ['❤️','💖','💝','💗'];
    const positions = [
        {left:'10%',delay:'0s'},
        {left:'25%',delay:'1s'},
        {left:'40%',delay:'2s'},
        {left:'60%',delay:'0.5s'},
        {left:'75%',delay:'1.5s'},
        {left:'90%',delay:'2.5s'}
    ];

    positions.forEach(pos => {
        let heart = document.createElement('div');
        heart.className = 'heart-float';
        heart.innerHTML = heartVariants[Math.floor(Math.random()*heartVariants.length)];
        heart.style.left = pos.left;
        heart.style.top = Math.random()*80+'%';
        heart.style.animationDelay = pos.delay;
        document.body.appendChild(heart);
    });
}

generateFloatingHearts();
</script>

<!-- Sparkle particles generator -->
<script>
function createSparkle(){
    const sparkles = ['✨','💫','⭐','✦'];
    const sparkle = document.createElement('div');
    sparkle.className = 'sparkle';
    sparkle.innerHTML = sparkles[Math.floor(Math.random()*sparkles.length)];
    sparkle.style.left = Math.random()*100+'vw';
    sparkle.style.top = Math.random()*100+'vh';
    sparkle.style.fontSize = (12+Math.random()*20)+'px';
    sparkle.style.setProperty('--tx',(Math.random()-0.5)*300+'px');
    sparkle.style.setProperty('--ty',-Math.random()*400+'px');
    document.body.appendChild(sparkle);
    setTimeout(() => sparkle.remove(), 3000);
}

// Generate sparkles periodically
setInterval(createSparkle, 300);

// Initial burst
for(let i=0;i<20;i++){
    setTimeout(createSparkle, i*100);
}
</script>

<!-- Main interaction -->
<script>
function activateRomance(){
    // Play romantic music with optimal volume
    const bgMusic = document.getElementById('bgMusic');
    bgMusic.volume = 0.4; // Gentle ambient volume
    bgMusic.currentTime = 0; // Start from beginning
    bgMusic.play().catch(e => {
        console.log('Music playback initiated (requires user interaction on some browsers)');
    });

    // Show message
    document.getElementById('messageContainer').style.display = 'block';

    // Create romantic heart burst
    for(let i=0;i<40;i++){
        setTimeout(() => {
            let heart = document.createElement('div');
            heart.className = 'heart-float';
            heart.innerHTML = ['❤️','💖','💝','💗','💓','💞'][Math.floor(Math.random()*6)];
            heart.style.left = (30+Math.random()*40)+'%';
            heart.style.top = '50%';
            heart.style.fontSize = (20+Math.random()*40)+'px';
            heart.style.animationDuration = (3+Math.random()*3)+'s';
            document.body.appendChild(heart);
        }, i*50);
    }

    // Continuous sparkle burst
    for(let i=0;i<15;i++){
        createSparkle();
        setTimeout(() => setInterval(createSparkle, 200), 1000);
    }

    // Disable button
    event.target.style.opacity = '0.5';
    event.target.style.cursor = 'default';
    event.target.disabled = true;
}
</script>

</body>
</html>
