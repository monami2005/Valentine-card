<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Sweet Secret - Playful 💕</title>
    <link href="https://fonts.googleapis.com/css2?family=Prata&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #ffeef8 0%, #fff9fc 50%, #ffe8f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d84678;
        }

        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, rgba(255, 182, 210, 0.2), transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(255, 192, 203, 0.15), transparent 50%);
            pointer-events: none;
            z-index: 1;
        }

        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }

        .screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .opening-text {
            font-family: 'Prata', serif;
            font-size: clamp(32px, 8vw, 64px);
            font-weight: 400;
            color: #d84678;
            line-height: 1.4;
            letter-spacing: 1px;
            animation: playful-appear 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
        }

        @keyframes playful-appear {
            0% {
                opacity: 0;
                transform: translateY(30px) scale(0.8);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .floating-hearts {
            display: flex;
            justify-content: center;
            gap: 25px;
            margin-top: 40px;
            opacity: 0;
            animation: fade-in 1.5s ease-out 0.3s forwards;
        }

        .heart-small {
            font-size: 36px;
            animation: playful-float 2.5s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .heart-small:hover {
            transform: scale(1.3);
        }

        .heart-small:nth-child(2) {
            animation-delay: 0.3s;
        }

        .heart-small:nth-child(3) {
            animation-delay: 0.6s;
        }

        @keyframes playful-float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }

        .emotional-message {
            font-size: clamp(24px, 6vw, 48px);
            font-weight: 400;
            color: #d84678;
            line-height: 1.6;
            letter-spacing: 0.5px;
            animation: playful-appear 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            opacity: 0;
            max-width: 600px;
        }

        .heart-pulsing {
            font-size: 70px;
            margin: 30px 0;
            animation: playful-heartbeat 1.5s ease-in-out infinite, fade-in 1.2s ease-out 0.2s forwards;
            opacity: 0;
            cursor: pointer;
            transition: filter 0.3s ease;
        }

        .heart-pulsing:hover {
            filter: drop-shadow(0 0 20px rgba(216, 70, 120, 0.6));
        }

        @keyframes playful-heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .hearts-display {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: clamp(50px, 12vw, 100px);
            margin-bottom: 40px;
            opacity: 0;
            animation: fade-in 1.2s ease-out forwards;
        }

        .heart-display {
            animation: playful-heartbeat 1.5s ease-in-out infinite;
            cursor: pointer;
            transition: filter 0.2s ease;
        }

        .heart-display:hover {
            filter: drop-shadow(0 0 20px rgba(216, 70, 120, 0.6));
        }

        .heart-display:nth-child(2) { animation-delay: 0.2s; }
        .heart-display:nth-child(3) { animation-delay: 0.4s; }

        .valentine-title {
            font-family: 'Prata', serif;
            font-size: clamp(36px, 8vw, 60px);
            color: #d84678;
            margin-bottom: 20px;
            opacity: 0;
            animation: playful-appear 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.1s forwards;
            letter-spacing: 1px;
        }

        .valentine-message {
            font-size: clamp(16px, 5vw, 24px);
            color: #c84678;
            line-height: 1.8;
            margin: 20px 0;
            max-width: 650px;
            opacity: 0;
            animation: playful-appear 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s forwards;
            font-weight: 400;
        }

        .nav-btn {
            position: absolute;
            bottom: 50px;
            padding: 14px 40px;
            border: 2px solid #d84678;
            border-radius: 50px;
            background: rgba(216, 70, 120, 0.1);
            color: #d84678;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Quicksand', sans-serif;
            opacity: 0;
            animation: fade-in 1.5s ease-out 1s forwards;
        }

        .nav-btn:hover {
            background: rgba(216, 70, 120, 0.2);
            box-shadow: 0 0 30px rgba(216, 70, 120, 0.4);
            transform: translateY(-4px) scale(1.05);
        }

        .final-btn {
            margin-top: 25px;
            padding: 15px 50px;
            font-size: 16px;
            border: 2px solid #d84678;
            background: rgba(216, 70, 120, 0.12);
            color: #d84678;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            letter-spacing: 1px;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            font-family: 'Quicksand', sans-serif;
            opacity: 0;
            animation: fade-in 1.5s ease-out 0.8s forwards;
        }

        .final-btn:hover {
            background: rgba(216, 70, 120, 0.2);
            box-shadow: 0 0 40px rgba(216, 70, 120, 0.5);
            transform: translateY(-4px) scale(1.08);
        }

        .sparkle {
            position: absolute;
            font-size: 24px;
            opacity: 0;
            animation: sparkle-blink 2s ease-in-out infinite;
            pointer-events: none;
        }

        @keyframes sparkle-blink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .sparkle-1 { top: 12%; right: 8%; animation-delay: 0s; }
        .sparkle-2 { top: 18%; left: 10%; animation-delay: 0.5s; }
        .sparkle-3 { bottom: 18%; right: 8%; animation-delay: 1s; }
        .sparkle-4 { bottom: 12%; left: 10%; animation-delay: 1.5s; }

        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @media(max-width: 480px) {
            .screen { padding: 30px 20px; }
            .nav-btn { bottom: 40px; padding: 12px 35px; font-size: 13px; }
            .final-btn { padding: 13px 40px; font-size: 14px; margin-top: 20px; }
            .floating-hearts { gap: 20px; margin-top: 30px; }
            .heart-small { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <audio id="bgMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <!-- Screen 1 -->
        <div class="screen active">
            <div class="opening-text">
                Hey… I have<br>something to<br>tell you 🥺
            </div>
            <div class="floating-hearts">
                <span class="heart-small">💕</span>
                <span class="heart-small">💕</span>
                <span class="heart-small">💕</span>
            </div>
            <button class="nav-btn" onclick="nextScreen()">Continue →</button>
        </div>

        <!-- Screen 2 -->
        <div class="screen">
            <div class="heart-pulsing">❤️</div>
            <div class="emotional-message">
                Every moment<br>with you<br>feels special
            </div>
            <p style="font-size: clamp(14px, 4vw, 18px); color: #c84678; margin-top: 30px; opacity: 0; animation: playful-appear 1.2s cubic-bezier(0.34, 1.56, 0.64, 1) 0.5s forwards; font-weight: 400;">
                You make my heart beat a little faster
            </p>
            <button class="nav-btn" onclick="nextScreen()">I feel it too →</button>
        </div>

        <!-- Screen 3 -->
        <div class="screen">
            <div class="hearts-display">
                <span class="heart-display">💕</span>
                <span class="heart-display">❤️</span>
                <span class="heart-display">💕</span>
            </div>
            <div class="valentine-title">Be My Valentine?</div>
            <div class="valentine-message">
                I want to cherish every moment with you,<br>
                To be the reason you smile,<br>
                And to love you more with each passing day.
            </div>
            <button class="final-btn" onclick="celebrate()">Yes! 💕</button>
            <button class="final-btn" onclick="celebrate()" style="margin-left: 12px;">Absolutely! 💕</button>

            <span class="sparkle sparkle-1">✨</span>
            <span class="sparkle sparkle-2">✨</span>
            <span class="sparkle sparkle-3">✨</span>
            <span class="sparkle sparkle-4">✨</span>
        </div>
    </div>

    <script>
        let currentScreen = 0;
        const screens = document.querySelectorAll('.screen');

        function nextScreen() {
            if (currentScreen < screens.length - 1) {
                screens[currentScreen].classList.remove('active');
                currentScreen++;
                screens[currentScreen].classList.add('active');
            }
        }

        function celebrate() {
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.35;
            bgMusic.currentTime = 0;
            bgMusic.play();

            const colors = ['❤️', '💕', '💖', '💗', '💓', '💞'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.textContent = colors[Math.floor(Math.random() * colors.length)];
                    heart.style.cssText = `
                        position: fixed;
                        left: ${Math.random() * 100}%;
                        top: 100%;
                        font-size: ${20 + Math.random() * 35}px;
                        z-index: 100;
                        pointer-events: none;
                        animation: float-up ${2 + Math.random() * 2.5}s ease-out forwards;
                        filter: drop-shadow(0 0 8px rgba(216, 70, 120, 0.5));
                    `;
                    document.body.appendChild(heart);
                    setTimeout(() => heart.remove(), 4500);
                }, i * 40);
            }
        }

        window.addEventListener('load', () => {
            const bgMusic = document.getElementById('bgMusic');
            bgMusic.volume = 0.12;
            bgMusic.play().catch(() => {});
        });

        const style = document.createElement('style');
        style.textContent = `
            @keyframes float-up {
                0% { transform: translateY(0) rotate(0deg); opacity: 1; }
                100% { transform: translateY(-${100 + Math.random() * 250}vh) rotate(${Math.random() * 360}deg); opacity: 0; }
            }
        `;
        document.head.appendChild(style);

        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextScreen();
        });
    </script>
</body>
</html>
